# OSV-Scanner policy for the dependency-scan gate in
# .github/workflows/security.yml.
#
# An entry here suppresses a finding; it does not fix one. Every entry states
# why the risk is accepted and carries an expiry, because an accepted risk that
# cannot expire is an unreviewed one. When ignoreUntil passes the gate fails
# again and the decision is made a second time, on that day's facts. Same
# policy as grown-men-grow's osv-scanner.toml, which set the precedent.
#
# THERE ARE NO ENTRIES, and that is the point.
#
# Two suppressions lived here until 2026-09-14, both for extract-zip 2.0.1 —
# a package with no release since March 2023 and no patched version at any
# version. They were honest: the chain was @lhci/cli -> lighthouse ->
# puppeteer-core -> @puppeteer/browsers, a devDependency reached only through a
# gate that does not run.
#
# But OSV-Scanner matches on ADVISORY ID, not on package. The first entry
# covered GHSA-jmr9-qjv8-65gv; when GHSA-7pqw-9j4j-h8q3 landed on the same
# unfixable package the gate went red again and blocked a fix for two critical
# unauthenticated RCEs in Next (#54). A gate that stops protecting and starts
# preventing protection is worse than no gate, and a suppression that must be
# extended every time upstream files another advisory against a dead package is
# a standing tax with no end date.
#
# @lhci/cli was installed and unwired — no lighthouserc, no CI job, no script —
# so removing it (#55) cleared both advisories permanently, along with 279
# packages and every remaining vulnerability in this lockfile. Re-add it when
# the Lighthouse gate is actually wired (#28); the advisories come back with it,
# and the decision gets made then with the gate's value on the other side of the
# scale, which is the only time that trade can honestly be weighed.
